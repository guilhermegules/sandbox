<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link
      href="https://fonts.googleapis.com/css?family=Pacifico|Roboto:100,300,400,500,700,900"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/img/orange-logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Fruta & Fruto</title>
    <link href="./assets/css/normalize.css" rel="stylesheet" />
    <link href="./assets/css/reset.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/header/header.css" />
    <link rel="stylesheet" href="./assets/css/navigation/navigation-item.css" />
    <link rel="stylesheet" href="./assets/css/navigation/navigation-link.css" />
    <link rel="stylesheet" href="./assets/css/navigation/navigation-list.css" />
    <link rel="stylesheet" href="./assets/css/navigation/navigation.css" />
    <link rel="stylesheet" href="./assets/css/banner/banner.css" />
    <link rel="stylesheet" href="./assets/css/banner/banner-image.css" />
    <link rel="stylesheet" href="./assets/css/banner/banner-title.css" />

  <body>
    <header class="header">
      <img
        class="header__logo"
        src="./assets/img/logo.jpg"
        alt="Fruta & Fruto"
      />

      <nav class="navigation">
        <ul class="navigation__list">
          <li class="navigation__item">
            <a class="navigation__link active" href="#">Início</a>
          </li>
          <li class="navigation__item">
            <a class="navigation__link" href="#">Receitas</a>

          <li class="navigation__item">
            <a class="navigation__link" href="#">Quem somos</a>

          <li class="navigation__item">
            <a class="navigation__link" href="#">Comunidade</a>
          </li>
        </ul>
      </nav>
    </header>
    <section class="banner">
      <img
        class="banner__image"
        src="./assets/img/banner.jpg"
        alt="Banner fruteira"
      />
      <h2 class="banner__title">Reaproveite melhor os alimentos!</h2>
    </section>
    <section class="about">
      <h2 class="about__title">Receitas para economizar e ganhar saúde</h2>
      <p class="about__description">
        Nossas receitas ajudam você a aproveitar melhor os alimentos,
        economizar, ganhar tempo e praticidade
