syntax = "proto3";

package com.example.grpc;

option java_multiple_files = true;
option java_package = "com.example.grpc.proto";
option java_outer_classname = "ProductProto";

message ProductLookupRequest {
  string product_id = 1;
}

message ProductFilterRequest {
  string category = 1;
  double max_price = 2;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  string category = 3;
  double price = 4;
}

service ProductService {
  // Unary RPC
  rpc GetProduct (ProductLookupRequest) returns (ProductResponse);

  // Server Streaming RPC
  rpc ListProducts (ProductFilterRequest) returns (stream ProductResponse);
}
