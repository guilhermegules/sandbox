<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./redux.min.js"></script>
    <title>Immutability</title>
  </head>
  <body>
    <script>
      const initialState = {
        name: "Guilherme",
        age: 23,
      };

      function reducer(state = initialState, action) {
        switch (action.type) {
          case "CHANGE_NAME":
            return { ...state, name: action.payload };
          default:
            return state;
        }
      }

      const store = Redux.createStore(
        reducer,
        window.__REDUX_DEVTOOLS_EXTENSION__ &&
          window.__REDUX_DEVTOOLS_EXTENSION__()
      );

      store.dispatch({ type: "CHANGE_NAME", payload: "João" });
      store.dispatch({ type: "CHANGE_NAME", payload: "Maria" });
      store.dispatch({ type: "CHANGE_NAME", payload: "Pedro" });
    </script>
  </body>
</html>
