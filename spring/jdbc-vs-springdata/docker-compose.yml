services:
  postgres:
    image: postgres:16
    container_name: jdbc-vs-jpa-postgres
    environment:
      POSTGRES_DB: comparison
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d comparison"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: