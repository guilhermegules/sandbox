# Yarn Modern / Berry configuration (.yarnrc.yml)

# Resolution linker: 'pnp' (Plug'n'Play), 'node-modules', or 'pnpm'
nodeLinker: pnp

# Zero-installs configuration (store lightweight zip packages locally)
enableGlobalCache: false
compressionLevel: 0

# Security and telemetry
enableTelemetry: false
enableImmutableInstalls: false
