services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/urlshortener?sslmode=disable
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=development
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "3GB"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      loki:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - app_logs:/var/log/app

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=urlshortener
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1GB"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1GB"

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
      - app_logs:/var/log/app
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512MB"

  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yml:/etc/promtail/config.yml:ro
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256MB"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512MB"

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6-load-test.js:/home/k6/script.js:ro
    environment:
      - BASE_URL=http://app:3000
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512MB"
    entrypoint:
      ["k6", "run", "--vus=50", "--duration=30s", "/home/k6/script.js"]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  app_logs:
