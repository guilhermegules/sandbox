<div class="button-group" role="radiogroup" [attr.aria-label]="label">
  <label class="button-group__label">{{ label }}</label>

  <div class="button-group__radio--yes">
    <input
      type="radio"
      [id]="id + '-yes'"
      [name]="id"
      [checked]="value === OPTIONS.YES"
      (changed)="activate(OPTIONS.YES)"
    />
    <label [for]="id + '-yes'">Yes</label>
  </div>

  <div class="button-group__radio--no">
    <input
      type="radio"
      [id]="id + '-no'"
      [name]="id"
      [checked]="value === OPTIONS.NO"
      (changed)="activate(OPTIONS.NO)"
    />
    <label [for]="id + '-no'">No</label>
  </div>
</div>
