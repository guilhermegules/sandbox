<div class="button-group">
  <span class="button-group__label">{{ label }}</span>
  <button
    class="button-group__button--yes"
    [class.button-group__button--pressed]="value === OPTIONS.YES"
    (click)="activate(OPTIONS.YES)"
    type="button"
  >
    Yes
  </button>
  <button
    class="button-group__button--no"
    [class.button-group__button--pressed]="value === OPTIONS.NO"
    (click)="activate(OPTIONS.NO)"
    type="button"
  >
    No
  </button>
</div>
