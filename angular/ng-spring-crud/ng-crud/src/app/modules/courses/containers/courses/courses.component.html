<mat-card>
  <mat-card-content>
    <mat-toolbar color="primary"> Cursos disponíveis </mat-toolbar>

    <div class="mat-elevation-z8 courses-list">
      <app-courses-list
        *ngIf="courses$ | async as courses; else loading"
        [courses]="courses"
        (onAdd)="onAdd()"
      ></app-courses-list>
    </div>
  </mat-card-content>
</mat-card>

<ng-template #loading>
  <div class="loading-spinner-container">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
