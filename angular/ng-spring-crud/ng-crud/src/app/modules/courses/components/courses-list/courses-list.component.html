<mat-table [dataSource]="courses" class="courses-list">
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>Curso</mat-header-cell>
    <mat-cell *matCellDef="let course">{{ course.name }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="category">
    <mat-header-cell mat-header-cell *matHeaderCellDef
      >Categoria</mat-header-cell
    >
    <mat-cell mat-cell *matCellDef="let course">
      {{ course.category }}
      <mat-icon aria-hidden="false" aria-label="Categoria do curso">{{
        course.category | category
      }}</mat-icon>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="courses-list__action--header">
      <button
        (click)="onAdd.emit()"
        mat-mini-fab
        class="mat-elevation-z"
        color="accent"
        aria-label="Adicionar curso"
      >
        <mat-icon>add</mat-icon>
      </button>
    </mat-header-cell>
    <mat-cell *matCellDef="let course" class="courses-list__action">
      <button
        mat-icon-button
        color="primary"
        aria-label="Editar curso"
        (click)="onEdit.emit(course)"
      >
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button color="warn" aria-label="Remover curso">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="DISPLAYED_COLUMNS"></mat-header-row>
  <mat-row *matRowDef="let row; columns: DISPLAYED_COLUMNS"></mat-row>
</mat-table>
