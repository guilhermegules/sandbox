<div class="row">
  <div class="col-12">
    <h1>Edit a book {{ book.title }}</h1>
  </div>
</div>

<div class="row">
  <div class="col-4">
    <a [routerLink]="" (click)="activeForm = 'reactive'">Reactive Form</a>
  </div>
</div>

<form
  *ngIf="activeForm === 'reactive'"
  [formGroup]="bookEditForm"
  (ngSubmit)="onSubmit()"
  novalidate
>
  <div class="row mt-3">
    <div class="col-6">
      Reactive Form
    </div>
  </div>

  <div class="row">
    <div class="col-12 form-group">
      <label for="title">Title</label>
      <input
        type="text"
        formControlName="title"
        name="title"
        class="title form-control"
        [ngClass]="{
          'is-invalid':
            bookEditForm.controls['title'].touched &&
            bookEditForm.controls['title'].errors
        }"
        placeholder="Book Title :D"
      />
      <div class="invalid-feedback">
        Please provide a valid title!
      </div>
    </div>

    <div class="col-12 form-group">
      <label for="image">Image</label>
      <input
        type="text"
        formControlName="image"
        name="image"
        class="image form-control"
        [ngClass]="{
          'is-invalid':
            bookEditForm.controls['image'].touched &&
            bookEditForm.controls['image'].errors
        }"
        placeholder="Book Cover"
      />
      <div class="invalid-feedback">
        Please provide a valid image URL!
      </div>
    </div>

    <div class="col-12 form-group">
      <label for="description">Description</label>
      <textarea
        type="text"
        formControlName="description"
        name="description"
        class="imagdescriptione form-control"
        [ngClass]="{
          'is-invalid':
            bookEditForm.controls['description'].touched &&
            bookEditForm.controls['description'].errors
        }"
        placeholder="Book Description"
      ></textarea>
      <div class="invalid-feedback">
        Please provide a valid description!
      </div>
    </div>

    <div class="col-12 form-group">
      <label for="price">Price</label>
      <input
        type="number"
        formControlName="price"
        name="price"
        class="price form-control"
        [ngClass]="{
          'is-invalid':
            bookEditForm.controls['price'].touched &&
            bookEditForm.controls['price'].errors
        }"
        placeholder="Book Price"
      />
      <div class="invalid-feedback">
        Please provide a valid price!
      </div>
    </div>
  </div>

  <button
    type="submit"
    id="reactiveSubmitButton"
    class="btn btn-success"
    [disabled]="bookEditForm.valid ? null : ''"
  >
    Edit Book Info
  </button>
</form>
