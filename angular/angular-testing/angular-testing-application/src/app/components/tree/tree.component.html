<div *ngFor="let child of questions.children">
  <ng-container
    [ngTemplateOutlet]="resolveTemplate()"
    [ngTemplateOutletContext]="{ child: child, form: form }"
  >
  </ng-container>
</div>

<ng-template #input let-child="child" let-form="form">
  <div class="col-12 form-group" [formGroup]="form">
    <label for="title">{{ child.label }}</label>
    <input
      type="text"
      [formControlName]="child.paramName"
      [(ngModel)]="objectToFill[child.paramName]"
      class="title form-control"
    />
  </div>
</ng-template>

<ng-template #checkbox let-child="child" let-form="form">
  <div class="col-12 form-check" [formGroup]="form">
    <label class="form-check-label">{{ child.label }}</label>
    <input
      [formControlName]="child.paramName"
      [(ngModel)]="objectToFill[child.paramName]"
      type="checkbox"
    />
  </div>
</ng-template>

<ng-template #select let-child="child" let-form="form">
  <div class="col-12 form-select" [formGroup]="form">
    <label class="form-check-label">{{ child.label }}</label>
    <select
      [formControlName]="child.paramName"
      [(ngModel)]="objectToFill[child.paramName]"
    >
      <option
        *ngFor="let option of child.options"
        [selected]="objectToFill[child.paramName] === option.param"
        [value]="option.paramName"
        >{{ option.label }}</option
      >
    </select>
  </div>
</ng-template>

<ng-template #empty> </ng-template>
