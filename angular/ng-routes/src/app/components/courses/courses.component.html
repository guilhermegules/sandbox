<h3>Courses list</h3>

<p>Página: {{ page }}</p>

<div class="collection">
  <a
    class="collection-item"
    *ngFor="let course of courses"
    [routerLink]="['/', 'course', course.id]"
  >
    {{ course.name }}
  </a>
</div>

<span>
  <button class="waves-effect waves-light btn next-button" (click)="nextPage()">
    Próxima página
  </button>

  <button class="waves-effect waves-light btn" (click)="previousPage()">
    Página anterior
  </button>
</span>
