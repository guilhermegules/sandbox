<h3>Login</h3>

<div class="row">
  <div class="input-field col s12">
    <input id="user" type="text" class="validate" [(ngModel)]="user.name" />
    <label class="active" for="user">User</label>
  </div>
</div>

<div class="row">
  <div class="input-field col s12">
    <input
      id="password"
      type="password"
      class="validate"
      [(ngModel)]="user.password"
    />
    <label class="active" for="password">Password</label>
  </div>
</div>

<button
  class="btn waves-effect waves-light"
  type="submit"
  name="action"
  (click)="login()"
>
  Submit
</button>
