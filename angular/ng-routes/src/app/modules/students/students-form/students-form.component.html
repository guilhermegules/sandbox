<h3>Edit Student</h3>

<div class="row">
  <div class="col s12">
    <div class="row">
      <div class="input-field col s6">
        <input id="name" type="text" class="validate" [(ngModel)]="student.name" (input)="onInput()" />
        <label for="name" class="active">Name</label>
      </div>
      <div class="input-field col s6">
        <input id="email" type="email" class="validate" [(ngModel)]="student.email" (input)="onInput()" />
        <label for="email" class="active">Email</label>
      </div>
    </div>
  </div>
</div>
