<h3>Edit Student</h3>

<div class="row">
  <div class="col s12">
    <div class="row">
      <div class="input-field col s6">
        <input
          id="name"
          type="text"
          class="validate"
          [(ngModel)]="student.name"
        />
        <label for="name" class="active">Name</label>
      </div>
      <div class="input-field col s6">
        <input
          id="email"
          type="email"
          class="validate"
          [(ngModel)]="student.email"
        />
        <label for="email" class="active">Email</label>
      </div>
    </div>
  </div>
</div>
