apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-api
  template:
    metadata:
      labels:
        app: k8s-api
    spec:
      containers:
        - name: api
          image: guilhermegules/k8s-api:1.0
          ports:
            - containerPort: 3000
