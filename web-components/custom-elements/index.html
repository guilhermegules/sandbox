<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="./src/components/TimeFormatted.js"
      type="module"
      defer
    ></script>
    <script src="./src/components/HelloButton.js" type="module" defer></script>
    <script src="./src/components/LiveTimer.js" type="module" defer></script>
    <script src="./src/components/UserCard.js" type="module" defer></script>
    <script src="./src/components/CustomMenu.js" type="module" defer></script>
    <title>Web components POC</title>
  </head>
  <body>
    <template id="menu-template">
      <style>
        ul {
          margin: 0;
          list-style: none;
          padding-left: 20px;
        }

        ::slotted([slot="title"]) {
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
        }

        ::slotted([slot="title"])::before {
          content: "📂";
          font-size: 14px;
        }

        .closed ::slotted([slot="title"])::before {
          content: "📁";
        }

        .closed ul {
          display: none;
        }
      </style>

      <div class="menu">
        <slot name="title"></slot>
        <ul>
          <slot name="item"></slot>
        </ul>
      </div>
    </template>

    <custom-menu>
      <span slot="title">Candy menu</span>
      <li slot="item">Lollipop</li>
      <li slot="item">Fruit Toast</li>
      <li slot="item">Cup Cake</li>
    </custom-menu>

    <hr />

    <br />

    <time-formatted
      id="timeformatted"
      datetime="2019-12-01"
      year="numeric"
      month="long"
      day="numeric"
      hour="numeric"
      minute="numeric"
      second="numeric"
      time-zone-name="short"
    ></time-formatted>

    <br />

    <button is="hello-button">Click me</button>

    <button is="hello-button" disabled>Disabled</button>

    <br />

    <live-timer id="timer"></live-timer>

    <script>
      setInterval(
        () => timeformatted.setAttribute("datetime", new Date()),
        1000
      );
    </script>

    <script>
      timer.addEventListener("tick", (event) => console.log(event.detail));
    </script>

    <br />

    <user-card>
      <div>I like to have fun with Shadow Dom</div>
      <span slot="username">Guilherme Gules</span>
      <span slot="birthday">25.10.1999</span>
      <div>...And play videogames</div>
    </user-card>
  </body>
</html>
